[package]
name = "tpt-t-agri-crop"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
repository = "https://github.com/tpt-solutions/tpt-teleop-agri"
description = "SIMD Bayer→NDVI pipeline and variable-rate application (VRA) controller for tpt-teleop-agri (nightly-only)"

[dependencies]
tpt-t-agri-core = { path = "../tpt-t-agri-core" }
rkyv = { version = "0.8", features = ["bytecheck"] }
bytecheck = "0.8"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
